name: Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  verificar:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  revisar:
    if: github.event_name == 'pull_request'
    needs: verificar
    permissions:
      contents: read
      pull-requests: write
      checks: read
    uses: ./.github/workflows/dod-checker.yml
    secrets: inherit

  traducir:
    if: github.event_name == 'pull_request'
    needs: revisar
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-business-translator.yml
    secrets: inherit

  qa-review:
    if: github.event_name == 'pull_request'
    needs: traducir
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/qa-review.yml
    secrets: inherit
